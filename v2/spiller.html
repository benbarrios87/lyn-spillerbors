<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lynbørs 2.0 • Spiller</title>

  <link rel="icon" href="../lblogoen.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="../nav.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div id="navbar"></div>

<main class="page-wrap">

  <section id="playerHero" class="player-hero">Laster spiller...</section>

  <section class="data-grid">
    <div class="data-card">
      <h2>Sesong</h2>
      <div id="seasonStats">Laster...</div>
    </div>

    <div class="data-card">
      <h2>Høydepunkter</h2>
      <div id="highlights">Laster...</div>
    </div>
  </section>

  <section class="data-card">
    <h2>Børsutvikling</h2>
    <div id="trendChart">Laster...</div>
  </section>

  <section class="data-card">
    <h2>Kamp for kamp</h2>
    <div id="matchList">Laster...</div>
  </section>

</main>

<div id="footer"></div>

<script type="module">
import { renderNavbar, renderFooter } from "./js/layout.js";
import { fetchMatches } from "./js/matches.js";
import { fetchVotes, buildPlayerRatingStats } from "./js/ratings.js";
import {
  players,
  findPlayer,
  getPlayerImage,
  getPlayerPosition,
  getPlayerDisplayName
} from "./js/players.js";

document.getElementById("navbar").innerHTML = renderNavbar("spiller");
document.getElementById("footer").innerHTML = renderFooter();

const params = new URLSearchParams(window.location.search);
const playerId = params.get("id");
const legacyPlayer = params.get("player");

const heroEl = document.getElementById("playerHero");
const statsEl = document.getElementById("seasonStats");
const highlightsEl = document.getElementById("highlights");
const matchListEl = document.getElementById("matchList");
const trendChartEl = document.getElementById("trendChart");

function round(value, decimals = 2) {
  return Number(Number(value || 0).toFixed(decimals));
}

function getRatingClass(value) {
  const rating = Number(value || 0);
  if (rating >= 7.5) return "rating-good";
  if (rating >= 6) return "rating-ok";
  return "rating-bad";
}

function getMatchTitle(matchId, matches) {
  const match = matches.find(m => String(m.id) === String(matchId));
  if (!match) return matchId;
  return `${match.home} - ${match.away}`;
}

function getMatchDate(matchId, matches) {
  const match = matches.find(m => String(m.id) === String(matchId));
  if (!match || !match.date) return "";
  const d = new Date(match.date);
  if (Number.isNaN(d.getTime())) return "";
  return d.toLocaleDateString("no-NO", { day:"2-digit", month:"2-digit" });
}

function resolvePlayer() {
  if (playerId) {
    return players.find(p => p.id === playerId) || null;
  }

  if (legacyPlayer) {
    return findPlayer(legacyPlayer);
  }

  return null;
}

const TREND_WIDTH = 640;
const TREND_HEIGHT = 220;
const TREND_PAD_LEFT = 32;
const TREND_PAD_RIGHT = 14;
const TREND_PAD_TOP = 20;
const TREND_PAD_BOTTOM = 28;
const TREND_Y_MAX = 10;
const TREND_Y_TICKS = [2, 4, 6, 8, 10];

function trendTierColor(value) {
  const rating = Number(value || 0);
  if (rating >= 7.5) return "#3ee98a";
  if (rating >= 6) return "#ffd166";
  return "#ff6b6b";
}

function buildTrendSeries(matchRows, matches) {
  return matchRows
    .map(row => {
      const match = matches.find(m => String(m.id) === String(row.match_id));
      const date = match?.date ? new Date(match.date) : null;
      if (!date || Number.isNaN(date.getTime())) return null;

      return {
        matchId: row.match_id,
        date,
        average: Number(row.average) || 0,
        votes: row.votes,
        title: getMatchTitle(row.match_id, matches),
        dateLabel: getMatchDate(row.match_id, matches)
      };
    })
    .filter(Boolean)
    .sort((a, b) => a.date - b.date);
}

function trendX(index, count) {
  const plotW = TREND_WIDTH - TREND_PAD_LEFT - TREND_PAD_RIGHT;
  if (count <= 1) return TREND_PAD_LEFT + plotW / 2;
  return TREND_PAD_LEFT + (index / (count - 1)) * plotW;
}

function trendY(value) {
  const plotH = TREND_HEIGHT - TREND_PAD_TOP - TREND_PAD_BOTTOM;
  const clamped = Math.max(0, Math.min(TREND_Y_MAX, Number(value) || 0));
  return TREND_PAD_TOP + plotH - (clamped / TREND_Y_MAX) * plotH;
}

function renderTrendChart(series) {
  if (series.length < 2) {
    return `<div class="trend-empty">Trenger minst to vurderte kamper for å vise en utvikling.</div>`;
  }

  const gridLines = TREND_Y_TICKS.map(tick => {
    const y = trendY(tick);
    return `
      <line x1="${TREND_PAD_LEFT}" y1="${y}" x2="${TREND_WIDTH - TREND_PAD_RIGHT}" y2="${y}" class="trend-grid" />
      <text x="${TREND_PAD_LEFT - 8}" y="${y + 4}" class="trend-axis-label" text-anchor="end">${tick}</text>
    `;
  }).join("");

  const linePoints = series
    .map((point, i) => `${trendX(i, series.length)},${trendY(point.average)}`)
    .join(" ");

  const dots = series.map((point, i) => `
    <circle
      cx="${trendX(i, series.length)}"
      cy="${trendY(point.average)}"
      r="5"
      fill="${trendTierColor(point.average)}"
      stroke="var(--panel)"
      stroke-width="2"
      class="trend-dot"
    />
  `).join("");

  const lastIndex = series.length - 1;
  const lastPoint = series[lastIndex];

  const labelIdxs = [...new Set([
    0,
    Math.floor((series.length - 1) / 2),
    lastIndex
  ])];

  const xLabels = labelIdxs.map(i => `
    <text x="${trendX(i, series.length)}" y="${TREND_HEIGHT - 8}" class="trend-axis-label" text-anchor="middle">
      ${series[i].dateLabel}
    </text>
  `).join("");

  return `
    <div class="trend-chart-wrap">
      <svg viewBox="0 0 ${TREND_WIDTH} ${TREND_HEIGHT}" class="trend-chart" role="img" aria-label="Børsutvikling over sesongen, kamp for kamp">
        ${gridLines}
        <polyline points="${linePoints}" class="trend-line" />
        ${dots}
        <text
          x="${trendX(lastIndex, series.length)}"
          y="${trendY(lastPoint.average) - 12}"
          class="trend-end-label"
          text-anchor="${series.length > 3 ? "end" : "middle"}"
        >${lastPoint.average.toFixed(1)}</text>
        ${xLabels}
        <line x1="0" y1="${TREND_PAD_TOP}" x2="0" y2="${TREND_HEIGHT - TREND_PAD_BOTTOM}" class="trend-crosshair" />
      </svg>
      <div class="trend-tooltip"></div>
      <div class="trend-caption">🟢 7.5+ · 🟡 6.0–7.4 · 🔴 under 6.0 &nbsp;·&nbsp; hold over et punkt for kampdetaljer</div>
    </div>
  `;
}

function attachTrendInteraction(container, series) {
  const svg = container.querySelector(".trend-chart");
  const tooltip = container.querySelector(".trend-tooltip");
  const crosshair = container.querySelector(".trend-crosshair");
  if (!svg || !tooltip || !crosshair || series.length < 2) return;

  function showAt(index) {
    const point = series[index];
    if (!point) return;

    const x = trendX(index, series.length);
    crosshair.setAttribute("x1", x);
    crosshair.setAttribute("x2", x);
    crosshair.style.opacity = "1";

    tooltip.innerHTML = "";

    const value = document.createElement("div");
    value.className = "trend-tooltip-value";
    value.textContent = point.average.toFixed(1);

    const sub = document.createElement("div");
    sub.className = "trend-tooltip-sub";
    sub.textContent = `${point.title} · ${point.dateLabel}`;

    tooltip.appendChild(value);
    tooltip.appendChild(sub);

    const rect = svg.getBoundingClientRect();
    const pxRatio = rect.width / TREND_WIDTH;
    const left = Math.max(4, Math.min(rect.width - 4, x * pxRatio));

    tooltip.style.left = `${left}px`;
    tooltip.style.opacity = "1";
  }

  function hide() {
    crosshair.style.opacity = "0";
    tooltip.style.opacity = "0";
  }

  function nearestIndex(clientX) {
    const rect = svg.getBoundingClientRect();
    if (!rect.width) return 0;

    const relX = ((clientX - rect.left) / rect.width) * TREND_WIDTH;

    let best = 0;
    let bestDist = Infinity;

    series.forEach((_, i) => {
      const dist = Math.abs(trendX(i, series.length) - relX);
      if (dist < bestDist) {
        bestDist = dist;
        best = i;
      }
    });

    return best;
  }

  svg.addEventListener("pointermove", (e) => showAt(nearestIndex(e.clientX)));
  svg.addEventListener("pointerdown", (e) => showAt(nearestIndex(e.clientX)));
  svg.addEventListener("pointerleave", hide);
}

async function init() {
  const playerInfo = resolvePlayer();

  if (!playerInfo) {
    heroEl.innerHTML = `<div class="data-card">Fant ikke spiller.</div>`;
    statsEl.innerHTML = "";
    highlightsEl.innerHTML = "";
    matchListEl.innerHTML = "";
    trendChartEl.innerHTML = "";
    return;
  }

  const [votes, matches] = await Promise.all([
    fetchVotes(),
    fetchMatches()
  ]);

  const stats = buildPlayerRatingStats(votes);
  const playerStats = stats[playerInfo.short] || stats[playerInfo.name];

  if (!playerStats) {
    heroEl.innerHTML = `
      <div class="player-hero-card">
        <img src="${getPlayerImage(playerInfo.short)}" class="hero-avatar" onerror="this.src='../lblogoen.png'">
        <div>
          <div class="badge">SPILLERPROFIL</div>
          <h1>${playerInfo.name}</h1>
          <div class="match-meta">${getPlayerPosition(playerInfo.short) || "Spiller"}</div>
          <p>Ingen børsdata funnet ennå.</p>
        </div>
      </div>
    `;
    statsEl.innerHTML = "";
    highlightsEl.innerHTML = "";
    matchListEl.innerHTML = "";
    trendChartEl.innerHTML = "";
    return;
  }

  const matchRows = Object.values(playerStats.matches || {})
    .sort((a, b) => b.average - a.average);

  const chronologicalRows = [...matchRows].sort((a, b) => {
    const ma = matches.find(m => String(m.id) === String(a.match_id));
    const mb = matches.find(m => String(m.id) === String(b.match_id));
    return new Date(mb?.date || 0) - new Date(ma?.date || 0);
  });

  const over7 = matchRows.filter(m => Number(m.average) >= 7).length;
  const over8 = matchRows.filter(m => Number(m.average) >= 8).length;

  heroEl.innerHTML = `
    <div class="player-hero-card">
      <img src="${getPlayerImage(playerInfo.short)}" class="hero-avatar" onerror="this.src='../lblogoen.png'">

      <div class="hero-info">
        <div class="badge">SPILLERPROFIL</div>
        <h1>${getPlayerDisplayName(playerInfo.short)}</h1>

        <div class="player-subline">
          ${playerInfo.short} · ${getPlayerPosition(playerInfo.short) || "Spiller"}
        </div>

        <div class="hero-rating ${getRatingClass(playerStats.average)}">
          ${playerStats.average}
        </div>

        <div class="match-meta">
          ${playerStats.votes} stemmer · ${matchRows.length} kamper vurdert
        </div>
      </div>
    </div>
  `;

  statsEl.innerHTML = `
    <div class="stat-grid">
      <div class="mini-stat">
        <span>Snitt</span>
        <strong>${playerStats.average}</strong>
      </div>

      <div class="mini-stat">
        <span>Stemmer</span>
        <strong>${playerStats.votes}</strong>
      </div>

      <div class="mini-stat">
        <span>Kamper</span>
        <strong>${matchRows.length}</strong>
      </div>

      <div class="mini-stat">
        <span>Over 7</span>
        <strong>${over7}</strong>
      </div>

      <div class="mini-stat">
        <span>Over 8</span>
        <strong>${over8}</strong>
      </div>

      <div class="mini-stat">
        <span>Beste</span>
        <strong>${playerStats.bestMatch?.average || "-"}</strong>
      </div>
    </div>
  `;

  highlightsEl.innerHTML = `
    <div class="highlight-list">
      <div class="highlight-row">
        <div>
          <strong>Beste kamp</strong>
          <div class="match-meta">
           ${playerStats.bestMatch
  ? `${getMatchTitle(playerStats.bestMatch.match_id, matches)}
     · ${getMatchDate(playerStats.bestMatch.match_id, matches)}`
  : "-"}
          </div>
        </div>
        <div class="rating-pill ${getRatingClass(playerStats.bestMatch?.average)}">
          ${playerStats.bestMatch?.average || "-"}
        </div>
      </div>

      <div class="highlight-row">
        <div>
          <strong>Svakeste kamp</strong>
          <div class="match-meta">
            ${playerStats.worstMatch ? getMatchTitle(playerStats.worstMatch.match_id, matches) : "-"}
          </div>
        </div>
        <div class="rating-pill ${getRatingClass(playerStats.worstMatch?.average)}">
          ${playerStats.worstMatch?.average || "-"}
        </div>
      </div>
    </div>
  `;

  matchListEl.innerHTML = chronologicalRows.map(match => `
    <a class="match-row profile-match-row" href="bors.html?match=${encodeURIComponent(match.match_id)}">
      <div>
        <strong>${getMatchTitle(match.match_id, matches)}</strong>
        <div class="match-meta">
          ${getMatchDate(match.match_id, matches)} · ${match.votes} stemmer
        </div>
      </div>

      <div class="rating-pill ${getRatingClass(match.average)}">
        ${match.average}
      </div>
    </a>
  `).join("");

  const trendSeries = buildTrendSeries(matchRows, matches);
  trendChartEl.innerHTML = renderTrendChart(trendSeries);
  attachTrendInteraction(trendChartEl, trendSeries);
}

init();
</script>

<style>
.player-hero {
  margin-bottom:24px;
}

.player-hero-card {
  display:flex;
  align-items:center;
  gap:24px;
  padding:26px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:28px;
  box-shadow:0 12px 35px rgba(0,0,0,0.32);
}

.hero-avatar {
  width:132px;
  height:132px;
  border-radius:26px;
  object-fit:cover;
  object-position:center top;
  background:white;
  border:3px solid rgba(255,255,255,0.18);
}

  color:var(--muted);

}

.hero-rating {

  font-weight:900;
  line-height:1;
}

.rating-good {
  color:#3ee98a;
}

.rating-ok {
  color:var(--gold);
}

.rating-bad {
  color:#ff6b6b;
}

.stat-grid {
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:14px;
}

.mini-stat {
  padding:18px;
  border-radius:18px;
  background:rgba(255,255,255,0.06);
}

.mini-stat span {
  display:block;
  margin-bottom:8px;
  color:var(--muted);
}

  font-size:30px;
}

.highlight-list {
  display:grid;
  gap:12px;
}

.highlight-row {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
  padding:14px;
  border-radius:18px;
  background:rgba(255,255,255,0.06);
}

.rating-pill {
  min-width:58px;
  text-align:center;

  text-decoration:none;

}

  }

  }

  .hero-rating {

  }

    grid-template-columns:1fr 1fr;
  }

  .highlight-row {
    align-items:flex-start;
  }
}

  position:relative;
}

  width:100%;
  height:auto;
  display:block;
  overflow:visible;
}

}

.trend-dot {
  cursor:pointer;
}

.trend-end-label {

  font-size:13px;
  font-weight:900;

}

.trend-crosshair {

  border-radius:14px;
  background:rgba(4,7,16,0.96);
  border:1px solid var(--line);
  box-shadow:0 12px 30px rgba(0,0,0,0.4);
  pointer-events:none;
  opacity:0;
  transition:opacity 0.1s ease;

}

.trend-tooltip-value {
  font-size:20px;
  font-weight:900;
  color:white;
}

.trend-tooltip-sub {
  margin-top:2px;
  font-size:12px;
  color:var(--muted);
}

.trend-caption {
  margin-top:10px;
  font-size:12px;
  color:var(--muted);
  text-align:center;
}

.trend-empty {
  padding:20px 0;
  color:var(--muted);
  text-align:center;
}
</style>

</body>
</html>
