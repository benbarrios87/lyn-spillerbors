<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lynbørs 2.0 • Kamparkiv</title>

  <link rel="icon" href="../lblogoen.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="../nav.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div id="navbar"></div>

<main class="page-wrap">

  <section class="page-header">
    <div class="badge">KAMPARKIV</div>

    <h1>Kamper</h1>

    <p>
      Kommende kamper, resultater og grunnmotoren bak hele Lynbørs.
    </p>
  </section>

  <section class="data-card team-filter-card">
    <div class="team-tabs" id="teamTabs"></div>
  </section>

  <section class="data-grid">

    <div class="data-card">
      <h2>Kommende kamper</h2>
      <div id="upcomingMatches" class="match-list">Laster...</div>
    </div>

    <div class="data-card">
      <h2>Siste resultater</h2>
      <div id="completedMatches" class="match-list">Laster...</div>
    </div>

  </section>

</main>

<div id="footer"></div>

<script type="module">
import { renderNavbar, renderFooter } from "./js/layout.js";
import { fetchMatches } from "./js/matches.js";
import { formatShortDate, getActualScore } from "./js/utils.js";

document.getElementById("navbar").innerHTML = renderNavbar("kamper");
document.getElementById("footer").innerHTML = renderFooter();

const teamTabsEl = document.getElementById("teamTabs");
const upcomingEl = document.getElementById("upcomingMatches");
const completedEl = document.getElementById("completedMatches");

const TEAM_LABELS = { men: "Herrer", women: "Kvinner" };

let allUpcoming = [];
let allCompleted = [];
let activeTeam = "all";

function formatDeadline(value) {
  if (!value) return "Ikke satt";

  try {
    return formatShortDate(value);
  } catch {
    return String(value);
  }
}

function teamBadge(match) {
  const team = match.team || "men";
  return `<span class="badge-small team-badge ${team}">${TEAM_LABELS[team] || team}</span>`;
}

function filterByTeam(matches) {
  if (activeTeam === "all") return matches;
  return matches.filter(match => (match.team || "men") === activeTeam);
}

function renderTeamTabs() {
  const teamsPresent = new Set(
    [...allUpcoming, ...allCompleted].map(match => match.team || "men")
  );

  const tabs = [
    { key: "all", label: "Alle" },
    ...["men", "women"].filter(team => teamsPresent.has(team)).map(team => ({ key: team, label: TEAM_LABELS[team] }))
  ];

  teamTabsEl.innerHTML = tabs.map(tab => `
    <button type="button" class="team-tab${tab.key === activeTeam ? " active" : ""}" data-team="${tab.key}">
      ${tab.label}
    </button>
  `).join("");

  teamTabsEl.querySelectorAll(".team-tab").forEach(btn => {
    btn.addEventListener("click", () => {
      if (btn.dataset.team === activeTeam) return;
      activeTeam = btn.dataset.team;
      renderTeamTabs();
      renderUpcoming(filterByTeam(allUpcoming));
      renderCompleted(filterByTeam(allCompleted));
    });
  });
}

async function init() {
  const matches = await fetchMatches();

  allUpcoming = matches
    .filter(match =>
      match.active === true &&
      match.actual_home === null &&
      match.actual_away === null
    )
    .sort((a, b) => new Date(a.date || a.deadline) - new Date(b.date || b.deadline));

  allCompleted = matches
    .filter(match =>
      match.actual_home !== null &&
      match.actual_home !== undefined &&
      match.actual_away !== null &&
      match.actual_away !== undefined
    )
    .sort((a, b) => new Date(b.date || b.deadline) - new Date(a.date || a.deadline));

  renderTeamTabs();
  renderUpcoming(filterByTeam(allUpcoming));
  renderCompleted(filterByTeam(allCompleted));
}

function renderUpcoming(matches) {
  upcomingEl.innerHTML = matches.length
    ? matches.map(match => `
      <div class="match-item">

        <div>
          <strong>${match.home} - ${match.away}</strong>

          <div class="match-meta">
            ${formatShortDate(match.date)}
          </div>

          <div class="badge-row">
            <div class="badge-small live">
              Aktiv kamp
            </div>
            ${teamBadge(match)}
          </div>
        </div>

        <div class="match-meta">
          Deadline:<br>
          ${formatDeadline(match.deadline)}
        </div>

      </div>
    `).join("")
    : `<div class="match-meta">Ingen kommende kamper.</div>`;
}

function renderCompleted(matches) {
  completedEl.innerHTML = matches.length
    ? matches.slice(0, 10).map(match => {
      const score = getActualScore(match);

      return `
        <div class="match-item">

          <div>
            <strong>${match.home} - ${match.away}</strong>

            <div class="match-meta">
              ${formatShortDate(match.date)}
            </div>

            <div class="badge-row">
              <div class="badge-small done">
                Ferdigspilt
              </div>
              ${teamBadge(match)}
            </div>
          </div>

          <div class="match-score">
            ${score.home} - ${score.away}
          </div>

        </div>
      `;
    }).join("")
    : `<div class="match-meta">Ingen resultater ennå.</div>`;
}

init();
</script>

<style>
.team-filter-card {
  padding:14px 20px;
}

.team-tabs {
  display:flex;
  gap:8px;
}

.team-tab {
  flex:1;
  padding:11px 14px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,0.14);
  background:rgba(255,255,255,0.06);
  color:var(--muted);
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  transition:0.15s;
}

.team-tab:hover {
  color:white;
  border-color:rgba(255,209,102,0.4);
}

.team-tab.active {
  background:var(--gold);
  border-color:var(--gold);
  color:#16100a;
}

.badge-row {
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:6px;
}

.badge-row .badge-small {
  margin-top:0;
}

.team-badge.men {
  background:rgba(11,99,229,0.22);
  color:#bcd6ff;
}

.team-badge.women {
  background:rgba(215,25,32,0.22);
  color:#ffc1c4;
}
</style>

</body>
</html>
