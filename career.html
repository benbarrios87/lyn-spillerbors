<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karrieregåten</title>

  <link rel="stylesheet" href="career.css">
  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="nav.css">
</head>

<body>

<div id="navbar"></div>

  <main class="career-wrap">

    <section class="career-hero">
      <div class="game-kicker">Lyn Games · Karrieregåten</div>
      <h1>🧩 Hvem er spilleren?</h1>
      <p>
        Klubbkarrieren avsløres steg for steg.
        Jo tidligere du gjetter riktig, jo flere poeng får du.
      </p>
    </section>

    <section class="career-card">
      <div id="progressText"></div>
      <div id="scoreText"></div>

      <div id="careerList"></div>

      <button id="revealBtn" onclick="revealNextClub()">
        Reveal next club →
      </button>

      <div class="guess-box">
        <input id="guessInput" type="text" placeholder="Skriv spiller...">
        <button onclick="submitCareerGuess()">Gjett</button>
      </div>

      <div id="message"></div>
    </section>

  </main>

  <script src="career-data.js"></script>
  <script type="module" src="career.js"></script>

<div id="footer"></div>
<script type="module">
  import { renderNavbar, renderFooter } from "./nav.js";
  document.getElementById("navbar").innerHTML = renderNavbar("games", "");
  document.getElementById("footer").innerHTML = renderFooter();
</script>

</body>
</html>
