<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karrieregåten</title>

  <link rel="stylesheet" href="career.css">
  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <a href="index.html" style="position:fixed;top:14px;left:14px;z-index:100;display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;background:rgba(255,255,255,0.10);border:1px solid rgba(255,255,255,0.22);color:white;text-decoration:none;font-family:Arial,sans-serif;font-size:13px;font-weight:bold;backdrop-filter:blur(6px);">← Forsiden</a>

  <main class="career-wrap">

    <section class="career-hero">
      <div class="game-kicker">Lyn Games · Karrieregåten</div>
      <h1>🧩 Hvem er spilleren?</h1>
      <p>
        Klubbkarrieren avsløres steg for steg.
        Jo tidligere du gjetter riktig, jo flere poeng får du.
      </p>
    </section>

    <section class="career-card">
      <div id="progressText"></div>
      <div id="scoreText"></div>

      <div id="careerList"></div>

      <button id="revealBtn" onclick="revealNextClub()">
        Reveal next club →
      </button>

      <div class="guess-box">
        <input id="guessInput" type="text" placeholder="Skriv spiller...">
        <button onclick="submitCareerGuess()">Gjett</button>
      </div>

      <div id="message"></div>
    </section>

  </main>

  <script src="career-data.js"></script>
  <script type="module" src="career.js"></script>

</body>
</html>
